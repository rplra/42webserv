root /var/www/; # Comments are allowed
autoindex on; # Only on and off are valid values (case ignored)

server {
    listen localhost:8080;
    server_name example;
    root var;
    index index.html;
    client_max_body_size 300000000;
    autoindex off;
    error_page 404 error.html;

    location / {
        allowed_methods GET;
        index index.html;
        client_max_body_size 345456789;
    }

    location /www {
        root var/www;
        allowed_methods GET;
    }

    location /form {
        root test;
        index form.html;
    }

    location /images {
        root images;
        allowed_methods GET;
        client_max_body_size 500098765;
        autoindex on;
        error_page 404 error.html;
    }

    location /test {
        root test;
        allowed_methods GET POST;
        error_page 403 error.html;
        index form.html;
    }

    location /42 {
        return 302 https://42kl.edu.my/;
    }

    location /submit {
        allowed_methods POST;
        index submit.html;
    }

    location /gmail {
        return 302 https://www.gmail.com/;
    }

    location /cgi-bin {
        root cgi;
        cgi .py /usr/bin/python3;
        cgi .php /opt/homebrew/bin/php-cgi;
    }

    location /upload {
        allowed_methods POST;
        upload_path /Users/natalieho/Documents/Webserv/uploads;
    }

    location /filterTask {
        root var/www;
        index filterTask.html;
    }

    location /calculator {
        root var/www;
        index calculator.html;        
    }

    location /addParcel {
        root var/www;
        index addParcel.html;        
    }
}

server {
    listen localhost:8081;
    server_name localhost local;
    root var;
    index index.html;
    client_max_body_size 300000000;
    autoindex off;
    error_page 404 error.html;

    location / {
        allowed_methods GET;
        index index.html;
        client_max_body_size 345456789;
    }

    location /www {
        allowed_methods GET;
        autoindex on;
    }

    location /form {
        return 302 /test;
    }

    location /images {
        root images;
        allowed_methods GET;
        client_max_body_size 500;
        autoindex off;
        error_page 404 error.html;
    }

    location /test {
        root test;
        allowed_methods POST;
        error_page 403 error.html;
    }

    location /youtube {
        return 302 https://www.youtube.com/;
    }
}
