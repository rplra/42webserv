root /var/www/; # Comments are allowed
autoindex on; # Only on and off are valid values (case ignored)

server {
    listen localhost:9743;
    server_name localhost local;
    root /Users/natalieho/Documents/Webserv/var;
    index index.html;
    client_max_body_size 300000000;
    autoindex off;
    error_page 404 error.html;

    location / {
        allowed_methods GET;
        index index.html;
        client_max_body_size 345456789;
    }

    location /42 {
        return 302 https://42kl.edu.my/;
    }

    location /youtube {
        return 302 https://www.youtube.com/;
    }
}

server {
    listen localhost:8080;
    server_name example;
    root /Users/natalieho/Documents/Webserv/var;
    index index.html;
    client_max_body_size 300000000;
    autoindex off;
    error_page 404 error.html;

    location / {
        allowed_methods GET;
        index index.html;
        client_max_body_size 345456789;
    }

    location /www {
        allowed_methods GET;
        autoindex on;
    }

    location /form {
        return 302 /test;
    }

    location /images {
        root /Users/natalieho/Documents/Webserv;
        allowed_methods GET;
        client_max_body_size 500;
        autoindex off;
        error_page 404 error.html;
    }

    location /test {
        root /Users/natalieho/Documents/Webserv;
        allowed_methods GET POST;
        error_page 403 error.html;
        index form.html;
    }

    location /42 {
        return 302 https://42kl.edu.my/;
    }

    location /gmail {
        return 302 https://www.gmail.com/;
    }
}

