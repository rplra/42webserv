server {
    listen localhost:9743;
    server_name localhost local;
    root /Users/natalieho/Documents/Webserv/var;
    index index.html;
    client_max_body_size 3087650;
    autoindex off;
    error_page 404 error.html;

    location / {
        allowed_methods GET;
        index index.html;
        client_max_body_size 345456789;
    }

    location /images {
        root /Users/natalieho/Documents/Webserv;
        allowed_methods GET;
        client_max_body_size 5000000;
        autoindex on;
        error_page 404 error.html;
    }

    location /42 {
        return 302 https://42kl.edu.my/;
    }
}

server {
    listen localhost:8080;
    server_name localhost local;
    root /Users/natalieho/Documents/Webserv/var;
    index index.html;
    client_max_body_size 987654321;
    autoindex off;
