server {
    listen localhost:9743;
    server_name localhost;
    root www;
    index index.html;
    client_max_body_size 30000000;
    autoindex off;

	error_page 400 /error/400.html;
	error_page 403 /error/403.html;
	error_page 404 /error/404.html;
	error_page 405 /error/405.html;
	error_page 411 /error/411.html;
	error_page 413 /error/413.html;
	error_page 500 /error/500.html;
	error_page 502 /error/502.html;
	error_page 503 /error/503.html;

    location / {
        allowed_methods GET;
        index index.html;
    }

    location /html/ {
        allowed_methods GET;
        autoindex on;
    }

    location /form {
        root www/html;
        allowed_methods GET POST;
        index form.html;
    }

    location /asset/ {
        allowed_methods GET;
		alias www/asset/img; #absolute_path
		autoindex on;
    }

	location /upload {
		allowed_methods GET;
		root www/html;
		index upload.html;
        # client_max_body_size 3;
	}

	location /uploads {
		allowed_methods GET;
	}

	location /42 {
        return 302 https://42kl.edu.my/;
    }

	location /gmail {
        return 302 https://www.gmail.com/;
    }

	location /error/ {
		root www/error;
	}

	location /test/ {
		autoindex off; 
	}

	location /cgi-bin {
		allowed_methods GET POST;
        root www/cgi;
        cgi_handler .py /usr/bin/python3;
		cgi_handler .php /opt/homebrew/bin/php-cgi;
		# client_max_body_size 3;	#test for 413
    }
}