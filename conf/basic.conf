server {
    listen localhost:9743;
    server_name localhost;
    root www;
    index index.html;
    client_max_body_size 30000000;
    autoindex off;

	error_page 400 /error/400.html;
	error_page 403 /error/403.html;
	error_page 404 /error/404.html;
	error_page 405 /error/405.html;
	error_page 411 /error/411.html;
	error_page 413 /error/413.html;
	error_page 500 /error/500.html;
	error_page 502 /error/502.html;
	error_page 503 /error/503.html;

    location / {
        allowed_methods GET;
        index index.html;
    }

    location /html/ {
        allowed_methods GET;
        autoindex on;
    }

    location /asset/ {
        allowed_methods GET;
		root /asset/img
		autoindex on;
    }

	location /upload {
		allowed_methods POST DELETE;
        upload_store www/upload;
        upload_max_file_size  100000000;
        autoindex on; 
	}

	location /cgi {
        allowed_methods GET POST;
		cgi_extension .py .php;
    }

	location /42 {
        return 302 https://42kl.edu.my/;
    }

	location /gmail {
        return 302 https://www.gmail.com/;
    }

	location /error/ {
		root www/error;
	}

	location /test/ {
		autoindex off; 
	}
}