server {
    listen localhost:8080;
    server_name localhost local;
    root www;
    index index.html;
    client_max_body_size 987654321;
    autoindex off;

	error_page 400 /error/400.html;
	error_page 403 /error/403.html;
	error_page 404 /error/404.html;
	error_page 405 /error/405.html;

    location / {
        allowed_methods GET;
        index index.html;
        client_max_body_size 145456559;
    }

    location /www {
        allowed_methods GET;
		alias www/;
        autoindex on;
    }

    location /form {
        return 302 /test;
    }

    location /gmail {
        return 302 https://www.gmail.com/;
    }
}