server {
    listen localhost:8080;
    server_name webserv.example.com;
    root www;
    index index_template.html;
    # index index.html;
    # client_max_body_size 1;
    client_max_body_size 300000000;
    autoindex on;

    error_page 400 /error/400.html;
	error_page 403 /error/403.html;
	error_page 404 /error/404.html;
	error_page 405 /error/405.html;
	error_page 411 /error/411.html;
	error_page 413 /error/413.html;
	error_page 500 /error/500.html;
	error_page 502 /error/502.html;
	error_page 503 /error/503.html;

    location /login {
        allowed_methods GET;
		alias www/;
        index logIn.html;
    }

    location /index {
        allowed_methods GET;
		alias www/;
        index index.html;
    }

    location /www {
		allowed_methods GET;
		alias www/;
        index index.html;
    }

    location /form {
        alias www/html/;
        index form.html;
    }

    location /cute/ {
		allowed_methods GET;
        alias www/asset/cat/;
        client_max_body_size 500098765;
        autoindex off;
    }

    location /img/ {
		allowed_methods GET;
        root www/asset;
        autoindex off;
    }

    location /cgi
    {
        autoindex off;
    }

    location /cgi-bin {
		allowed_methods GET POST;
        alias www/cgi/;
        cgi_handler .py /usr/bin/python3;
        cgi_handler .php /usr/bin/php;
        # cgi_handler .php /opt/homebrew/bin/php-cgi;
    }

    location /test {
		allowed_methods GET;
        alias www/html/;
        index form.html;
    }

    location /calculator {
		allowed_methods GET;
        alias www/html/;
        index calculator.html;
    }

    location /filterTaskPYTHON {
        alias www/html;
        allowed_methods GET POST;
        index filterTaskPYTHON.html;
    }

    location /filterTaskPHP {
        alias www/html;
        allowed_methods GET POST;
        index filterTaskPHP.html;
    }

    location /addParcel {
        alias www/html/;
        index addParcel.html;
    }

	location /upload {
		allowed_methods GET;
		alias www/html/;
		index upload.html;
	}

	location /uploads {
		allowed_methods GET;
	}

    location /redirect {
        return 302 https://www.gmail.com/;
    }

    location /redirect2 {
        return 302 https://www.wetransfer.com/;
    }

    location /large {
		allowed_methods GET POST;
		alias www/html/;
		index upload.html;
        client_max_body_size 1;
    }
}

server {
    listen localhost:8082;
    server_name localhost local;
    root www;
    index index_8082.html;
    # client_max_body_size 300000000;
    client_max_body_size 20; # test size overflow
    autoindex off;

    error_page 400 /error/400.html;
	error_page 403 /error/403.html;
	error_page 404 /error/404.html;
	error_page 405 /error/405.html;
	error_page 411 /error/411.html;
	error_page 413 /error/413.html;
	error_page 500 /error/500.html;
	error_page 502 /error/502.html;
	error_page 503 /error/503.html;

    location /www {
        allowed_methods GET;
		alias www/;
        autoindex on;
    }

    location /form {
        return 302 /test;
    }

	# 403 error if autoindex off
    location /images {
		allowed_methods GET;
        alias www/asset/img/;
        # client_max_body_size 500;
        autoindex on;
    }

	location /upload {
		allowed_methods GET;
		alias www/html/;
		index upload.html;
	}

	location /uploads/ {
		allowed_methods GET;
	}

    location /test {
		allowed_methods GET POST;
        alias www/html/;
        index form.html;
    }

    location /42 {
        allowed_methods GET;
        return 302 https://42kl.edu.my/;
    }

	location /cgi-bin {
		allowed_methods GET POST DELETE;                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                                        
        alias www/cgi/;
        cgi_handler .py /usr/bin/python3;
        cgi_handler .php /usr/bin/php;
        # cgi_handler .php /opt/homebrew/bin/php-cgi;
    }
}

