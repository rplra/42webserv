server {
    listen localhost:8080;
    server_name example;
    root www;
    index home.html;
    client_max_body_size 300000000;
    autoindex on;

    error_page 400 /error/400.html;
	error_page 403 /error/403.html;
	error_page 404 /error/404.html;
	error_page 405 /error/405.html;
	error_page 411 /error/411.html;
	error_page 413 /error/413.html;
	error_page 500 /error/500.html;
	error_page 502 /error/502.html;
	error_page 503 /error/503.html;

    location /login {
        allowed_methods GET;
        index logIn.html;
    }

    location /index {
        allowed_methods GET;
        index index.html;
    }

    location /www {
        index index.html;
        allowed_methods GET;
    }

    location /form {
        alias www/html;
        index form.html;
    }

    location /cute/ {
        alias www/asset/cat;
        allowed_methods GET;
        client_max_body_size 500098765;
        autoindex off;
    }

    location /img/ {
        root www/asset;
        allowed_methods GET;
    }

    location /cgi-bin {
        alias www/cgi;
        cgi_handler .py /usr/bin/python3;
        # cgi_handler .php /usr/bin/php;
        cgi_handler .php /opt/homebrew/bin/php-cgi;
        allowed_methods GET POST DELETE;
    }

    location /test {
        alias www/html;
        allowed_methods GET;
        index form.html;
    }

    location /submit {
        allowed_methods GET;
        index submit.html;
    }

    location /calculator {
        alias www/html;
        allowed_methods GET;
        index calculator.html;
    }

    location /filterTaskPYTHON {
        alias www/html;
        allowed_methods GET POST;
        index filterTaskPYTHON.html;
    }

    location /filterTaskPHP {
        alias www/html;
        allowed_methods GET POST;
        index filterTaskPHP.html;
    }

    location /addParcel {
        alias www/html;
        allowed_methods GET POST;
        index addParcel.html;
    }

	location /upload {
		allowed_methods GET;
		alias www/html;
		index upload.html;
	}

	location /uploads {
		allowed_methods GET;
	}

    location /gmail {
        return 302 https://www.gmail.com/;
    }
}

server {
    listen localhost:8081;
    server_name localhost local;
    root www;
    index index.html;
    client_max_body_size 300000000;
    autoindex off;

    error_page 400 /error/400.html;
	error_page 403 /error/403.html;
	error_page 404 /error/404.html;
	error_page 405 /error/405.html;
	error_page 411 /error/411.html;
	error_page 413 /error/413.html;
	error_page 500 /error/500.html;
	error_page 502 /error/502.html;
	error_page 503 /error/503.html;

    location /www {
        allowed_methods GET;
        autoindex on;
    }

    location /form {
        return 302 /test;
    }

    location /images {
        alias www/asset/img;
        allowed_methods GET;
        # client_max_body_size 500;
        # autoindex off;
    }

	location /upload {
		allowed_methods GET;
		alias www/html;
		index upload.html;
	}

	location /uploads/ {
		allowed_methods GET;
	}

    location /test {
        alias www/html;
        allowed_methods GET;
        index form.html;
    }

    location /42 {
        return 302 https://42kl.edu.my/;
    }

	location /cgi-bin {
        alias www/cgi;
        cgi_handler .py /usr/bin/python3;
        # cgi_handler .php /usr/bin/php;
        cgi_handler .php /opt/homebrew/bin/php-cgi;
        allowed_methods GET POST DELETE;
    }
}

