server {
    listen localhost:9743;
    server_name localhost local;
    root www;
    index index.html;
    client_max_body_size 30000000;
    autoindex off;

    error_page 400 /error/400.html;
	error_page 403 /error/403.html;
	error_page 404 /error/404.html;
	error_page 405 /error/405.html;
	error_page 411 /error/411.html;
	error_page 413 /error/413.html;
	error_page 500 /error/500.html;
	error_page 502 /error/502.html;
	error_page 503 /error/503.html;

    location /42 {
        allowed_methods GET;
        index index.html;
        client_max_body_size 34;
    }

    location /42/bye {
        return 302 https://42kl.edu.my/;
    }

    location /youtube {
        return 302 https://www.youtube.com/;
    }
}

server {
    listen localhost:8080;
    server_name example;
    root www;
    index index.html;
    client_max_body_size 300000000;
    autoindex off;

    error_page 400 /error/400.html;
	error_page 403 /error/403.html;
	error_page 404 /error/404.html;
	error_page 405 /error/405.html;
	error_page 411 /error/411.html;
	error_page 413 /error/413.html;
	error_page 500 /error/500.html;
	error_page 502 /error/502.html;
	error_page 503 /error/503.html;

    location / {
        allowed_methods GET;
        index index.html;
        client_max_body_size 345456789;
    }

    location /www {
        index index.html;
        allowed_methods GET;
    }

    location /form {
        root www/html;
        index form.html;
    }

    location /cat/ {
        root www/asset/cat;
        allowed_methods GET;
        client_max_body_size 500098765;
        autoindex on;
    }

    location /cgi-bin {
        root www/cgi;
        cgi_handler .py /usr/bin/python3;
        cgi_handler .php /opt/homebrew/bin/php-cgi;
        allowed_methods GET POST;
    }

    location /test {
        root www/html;
        allowed_methods GET;
        index form.html;
    }

    location /submit {
        allowed_methods GET;
        index submit.html;
    }

    location /calculator {
        root www/html;
        allowed_methods GET;
        index calculator.html;
    }

    location /filterTask {
        root www/html;
        allowed_methods GET POST;
        index filterTask.html;
    }

    location /addParcel {
        root www/html;
        allowed_methods GET POST;
        index addParcel.html;
    }

    location /gmail {
        return 302 https://www.gmail.com/;
    }
}

