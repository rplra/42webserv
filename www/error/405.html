<!DOCTYPE html>
<html lang="en">

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta charset="utf-8" />
    <title>Error</title>
	<style>
		html, body {
		height: 100%;      /* full viewport height */
		margin: 0;         /* remove default spacing */
		}

		body {
		display: flex;
		align-items: center;      /* vertical centering */
		justify-content: center;  /* horizontal centering */
		
		background: linear-gradient(
			237deg,
			rgba(184, 255, 220, 1) 0%,
			rgba(130, 139, 255, 1) 100%
		);
	    transition: background 0.1s linear; /* smooth gradient update */
		flex-direction: column;   /* stack items vertically if needed */
		}

		.frame {
		color: #861799;
		display: flex;
		flex-direction: column;
		align-items: center;  /* center text horizontally */
		gap: 16px;            /* spacing between heading and paragraph */
		padding: 0 40px; /* horizontal padding for content */
		max-width: 520px; /* optional, controls maximum width */
		}

		h1 {
		margin: 0;
		font-family: "Inter", Helvetica, Roboto, Arial, sans-serif;
		font-weight: 700;
		font-size: 36px;
		text-align: center;
		}

		p {
		margin: 0;
		font-family: "Inter", Helvetica, Roboto, Arial, sans-serif;
		font-weight: 400;
		font-size: 24px;
		text-align: center;
		}
	</style>
</head>

<body>
	<div class="frame">
		<h1>405 Method Not Allowed</h1>
		<p>The HTTP method is not supported for this resource</p>
	</div>

	<script>
		document.addEventListener('mousemove', (e) => {
			const xRatio = e.clientX / window.innerWidth; // 0 to 1
			const angle = xRatio * 360; // map to 0-360 degrees
			document.body.style.background = `linear-gradient(${angle}deg, rgba(184, 255, 220, 1) 0%, rgba(130, 139, 255, 1) 100%)`;
		});
	</script>
</body>
</html>
