<!DOCTYPE html>
<html>
	<head>
		<meta charset='utf-8' />
		<title>Login</title>

		<style>
			body {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 24px;
			/* flex-direction: column; */
			/* gap: 10px; */
			position: relative;
			background: linear-gradient(
				237deg,
				rgba(184, 255, 220, 1) 0%,
				rgba(130, 139, 255, 1) 100%
				);
			}

			.card {
			display: flex;
			flex-direction: column;
			width: 100%;
			max-width: 520px;
			/* padding: 48px; */
			gap: 32px;
			background-color: #ffffff;
			border-radius: 16px;
			padding: 72px clamp(24px, 5vw, 48px);
			}

			.desc {
			gap: 12px;
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			position: relative;
			align-self: stretch;
			width: 100%;
			flex: 0 0 auto;
			}

			h1, p {
				margin: 0;
			}
			h1 {
			position: relative;
			align-self: stretch;
			font-family: 'Inter-Bold', Helvetica;
			font-weight: 700;
			color: #4d1799;
			font-size: 36px;
			text-align: center;
			letter-spacing: 0;
			line-height: normal;
			}

			p {
			position: relative;
			align-self: stretch;
			font-family: 'Inter-Regular', Helvetica;
			font-weight: 400;
			color: #4d1799;
			font-size: 24px;
			text-align: center;
			letter-spacing: 0;
			line-height: normal;
			}

			.input-field-group {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			justify-content: center;
			gap: 16px;
			position: relative;
			align-self: stretch;
			width: 100%;
			flex: 0 0 auto;
			}

			.input-field {
			display: flex;
			height: 54px;
			align-items: center;
			padding: 4px 16px;
			position: relative;
			align-self: stretch;
			border-radius: 12px;
			border: 1px solid;
			border-color: #aeaeae;
			}

			.input-text-wrapper {
			border: none;
			width: 100%;
			background: transparent;
			position: relative;
			color: #5f48f9;
			text-align: left;
			font-family: 'Inter-Regular', Helvetica;
			font-weight: 100;
			font-size: 18px;
			letter-spacing: 0;
			line-height: normal;
			}

			.input-text-wrapper::placeholder {
			color: #c2b3ce;
			opacity: 1;
			}

			.input-text-wrapper:focus {
			outline: none;
			}

			.input-field:focus-within {
			border-color: #717bff;
			box-shadow: 0 0 0 2px rgba(113, 123, 255, 0.2);
			}

			.navigation {
			display: flex;
			flex-wrap: wrap;
			padding-top: 16px;
			align-items: flex-end;
			justify-content: center;
			gap: 8px 8px;
			position: relative;
			align-self: stretch;
			width: 100%;
			flex: 0 0 auto;
			}

			.button-text {
			position: relative;
			width: fit-content;
			font-family: 'Inter-Bold', Helvetica;
			font-weight: 700;
			color: #ffffff;
			font-size: 18px;
			text-align: center;
			letter-spacing: 0;
			line-height: normal;
			}

			.btn {
			all: unset;
			/* box-sizing: border-box; */
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			padding: 14px 16px;
			position: relative;
			flex: 0 0 auto;
			border-radius: 8px;
			cursor: pointer;
			transition: background-color 0.2s ease;
			}

			.btn-primary {
				background-color: #717bff;
			}

			.btn-secondary {
				background-color: #86c7da;
			}

			.btn-primary:hover {
			background-color: #5a66e6;
			}

			.btn-primary:active {
			background-color: #a05aeb;
			}

			.btn-primary:focus-visible {
			outline: 2px solid #4a90e2;
			outline-offset: 2px;
			}

			.btn-secondary:hover {
			background-color: #6fb3c9;
			}

			.btn-secondary:active {
			background-color: #5a9fb8;
			}

			.btn-secondary:focus-visible {
			outline: 2px solid #4a90e2;
			outline-offset: 2px;
			}

			.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border-width: 0;
			}

			.error {
			color: #f38265;
			text-align: left;
			font-family: 'Inter-Regular', Helvetica;
			font-size: 14px;
			display: none;
			}

			.error.active {
			display: inline;
			}
		</style>

	</head>
	<body>
		<section class='card'>
			<header class='desc'>
				<h1>Login</h1>
				<p>Welcome back!</p>
			</header>

			<form class='input-field-group' action='/cgi-bin/logIn.php' method='post'>
				<div class='input-field'>
					<label for='username' class='visually-hidden'>username</label>
					<input
						type='text'
						id='username'
						class='input-text-wrapper'
						placeholder='Username'
						name='username'
						required
						aria-required='true'
					/>
				</div>

				<div class='input-field'>
					<label for='password' class='visually-hidden'>Email</label>
					<input
						type='password'
						id='password'
						class='input-text-wrapper'
						placeholder='Password'
						name='password'
						required
						aria-required='true'
					/>
				</div>
				<span class='error'>Please enter a valid number</span>

				<div class='navigation'>
					<button type='submit' class='btn btn-primary'>
						<span class='button-text'>Login</span>
					</button>
					<button type='button' class='btn btn-secondary' onclick='location.href="/index"'>
						<span class='button-text'>Back to Home</span>
					</button>
				</div>

			</form>

			<script>
				// mouse reactive bg
				document.addEventListener('mousemove', (e) => {
				const xRatio = e.clientX / window.innerWidth; // 0 to 1
				const angle = xRatio * 360; // map to 0-360 degrees
				document.body.style.background = `linear-gradient(${angle}deg, rgba(184, 255, 220, 1) 0%, rgba(130, 139, 255, 1) 100%)`;
				});
			</script>

		</section>
	</body>
</html>
