<!DOCTYPE html>
<html>
<head>
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta charset="utf-8" />
	
	<style>
		*, *::before, *::after {
		box-sizing: border-box;
		}

		html,
		body {
		margin: 0px;
		min-height: 100vh;
		}
		/* a blue color as a generic focus style */
		button:focus-visible {
		outline: 2px solid #4a90e2 !important;
		outline: -webkit-focus-ring-color auto 5px !important;
		}
		a {
		text-decoration: none;
		}
		body {
		display: flex;
		flex-direction: column;
		align-items: flex-start;
		gap: 40px;
		padding: 0px 24px 40px;
		position: relative;
		background: linear-gradient(
			237deg,
			rgba(184, 255, 220, 1) 0%,
			rgba(130, 139, 255, 1) 100%
		);
		}

		.header {
		display: flex;
		align-items: center;
		gap: 10px;
		padding: 40px;
		flex: 0 0 auto;
		background-color: transparent;
		border-radius: 200px;
		position: relative;
		align-self: stretch;
		width: 100%;
		}

		.header-wrapper {
		position: relative;
		width: fit-content;
		margin-top: -1.00px;
		font-family: "Monofett-Regular", Helvetica;
		font-weight: 400;
		color: #2c48d0;
		font-size: 24px;
		letter-spacing: 0;
		line-height: normal;
		white-space: nowrap;
		}

		.frame {
		display: flex;
		flex-direction: column;
		align-items: center;
		justify-content: center;
		gap: 10px;
		padding: 0px 24px 40px;
		position: relative;
		align-self: stretch;
		width: 100%;
		flex: 0 0 auto;
		}

		.block {
		padding-top: 80px;
		display: flex;
		flex-direction: column;
		align-items: flex-start;
		gap: 32px;
		position: relative;
		align-self: stretch;
		width: 100%;
		flex: 0 0 auto;
		}

		.subheader {
		height: 47px;
		border-radius: 100px 8px 100px 8px;
		object-fit: cover;
		position: relative;
		align-self: stretch;
		width: 100%;
		}

		.row {
		display: flex;
		min-height: 300px;
		align-items: stretch;
	    justify-content: center;
		gap: 24px;
		padding: 0px 56px;
		position: relative;
		width: 100%;
		}

		.card > * {
		margin: 0;
		}

		.card.hidden {
			visibility: hidden; /* This hides the card but keeps its space in the layout */
		}

		.card {
		display: flex;
		flex-direction: column;
		align-items: flex-start;
		gap: 8px;
		padding: 24px;
		position: relative;
		/* flex: 1; */
		align-self: stretch;
		flex-grow: 1;

		/* display: flex; */
		/* flex-direction: column; */
		/* align-items: flex-start; */
		/* gap: 8px; */
		/* padding: 24px; */

		flex: 1 1 auto;        /* allow grow + shrink */
		max-width: 344px;     /* ← cap the size */
		width: 100%;          /* fill available space until max */

		/* background-color: #ffffff33;
		border-radius: 24px;
		border: 4px solid;
		border-color: #00000000;
		backdrop-filter: blur(5.0px) brightness(108.0%) saturate(93.8%);
		-webkit-backdrop-filter: blur(5.0px) brightness(108.0%) saturate(93.8%);
		box-shadow: inset 1px 0 0 rgba(255, 255, 255, 0.32), inset -1px 0 3px
			rgba(0, 0, 0, 0.11); */

		background: linear-gradient(135deg, rgba(255,255,255,0.15), rgba(255,255,255,0.05));
		border-radius: 24px;
		border: 1px solid rgba(255,255,255,0.2);
		
		backdrop-filter: blur(12px) brightness(110%) saturate(120%);
		-webkit-backdrop-filter: blur(12px) brightness(120%) saturate(120%);
		
		box-shadow:
			inset 1px 0 0 rgba(255,255,255,0.32),
			inset -1px 0 3px rgba(0,0,0,0.11),
			0 8px 32px rgba(0,0,0,0.12);
		}

		.card .icon {
		position: relative;
		width: 35px;
		height: 35px;
		aspect-ratio: 1;
		object-fit: cover;
		}

		.card .card-title {
		position: relative;
		align-self: stretch;
		font-family: "Inter-Bold", Helvetica;
		font-weight: 700;
		color: #000000;
		font-size: 22px;
		letter-spacing: 0;
		line-height: normal;
		}

		.card .methods {
		position: relative;
		align-self: stretch;
		font-family: "Inter-SemiBold", Helvetica;
		font-weight: 600;
		color: #000000;
		font-size: 14px;
		letter-spacing: 0;
		line-height: normal;
		}

		.card .description {
		position: relative;
		align-self: stretch;
		font-family: "Inter-Regular", Helvetica;
		font-weight: 400;
		color: #000000;
		font-size: 18px;
		letter-spacing: 0;
		line-height: normal;
		margin-bottom: 4px;
		}

		.card .navigation {
		margin-top: auto;
		display: flex;
		flex-wrap: wrap;
		gap: 8px 8px;
		position: relative;
		align-self: stretch;
		width: 100%;
		/* align-items: flex-end; */
		/* padding: 24px 0px 0px; */
		/* flex: 1; */
		/* flex-grow: 1; */
		}

		.button-text {
		position: relative;
		width: fit-content;
		margin-top: -1.00px;
		font-family: "Inter-Bold", Helvetica;
		font-weight: 700;
		color: #ffffff;
		font-size: 18px;
		text-align: center;
		letter-spacing: 0;
		line-height: normal;
		}

		.navigation .button-wrapper,
		.navigation .button-wrapper-focus {
		display: inline-flex;
		align-items: center;
		justify-content: center;
		gap: 10px;
		padding: 12px 16px;
		position: relative;
		flex: 0 0 auto;
		background-color: #717bff;
		border-radius: 12px;
		}

		.navigation .button-wrapper-focus {
		background-color: #e17800;
		}
		.navigation .button-wrapper:hover,
		.navigation .button-wrapper-focus:hover {
		background-color: #5064FF;
		transform: translateY(-1px);
		}

		.navigation .button-wrapper-focus:hover {
		background-color: #ED6700;
		}
	</style>
</head>

<body>
	<!-- <header class="header"><div class="header-wrapper">introduction</div></header> -->

	<div class="frame">
		<!-- 1st block -->
		<div class="block">
			<img class="subheader" src="asset/home/Header-9743.png" />
			<!-- modular row -->
			<div class="row">
				<div class="card">
					<img class="icon" src="asset/home/1-1_by-freepik.png" />
					<div class="card-title">Switch Ports</div>
					<p class="methods">Methods | N/A</p>
					<p class="description">Switch to different ports</p>
					<div class="navigation">
						<a href="http://localhost:8080" class="button-wrapper"><span class="button-text">8080</span></a>
						<a href="http://localhost:9743" class="button-wrapper-focus"><span class="button-text">9743</span></a>
						<a href="http://localhost:8082" class="button-wrapper"><span class="button-text">8082</span></a>
						<!-- dup line above for more buttons -->
					</div>
				</div>

				<div class="card">
					<img class="icon" src="asset/home/1-2_by-freepik.png" />
					<div class="card-title">Redirection</div>
					<div class="methods">Methods | N/A</div>
					<div class="description">Test redirection to different websites</div>
					<div class="navigation">
						<a href="/42/bye" class="button-wrapper"><span class="button-text">42KL</span></a>
						<a href="/youtube" class="button-wrapper"><span class="button-text">Youtube</span></a>
					</div>
				</div>
				<div class="card hidden"></div>
			</div>
		</div>
	</div>
</body>
</html>
