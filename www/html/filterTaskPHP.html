<!DOCTYPE html>
<html>
	<head>
		<title>Filter Task (PHP)</title>

		<style>
			body {
			display: flex;
			justify-content: center;
			align-items: center;
			min-height: 100vh;
			padding: 24px;
			/* flex-direction: column; */
			/* gap: 10px; */
			position: relative;
			background: linear-gradient(
				237deg,
				rgba(184, 255, 220, 1) 0%,
				rgba(130, 139, 255, 1) 100%
				);
			}

			.card {
			display: flex;
			flex-direction: column;
			width: 100%;
			max-width: 520px;
			padding: 48px;
			gap: 32px;
			background-color: #ffffff;
			border-radius: 16px;
			padding: clamp(24px, 5vw, 48px);
			}

			.desc {
			gap: 8px;
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			position: relative;
			align-self: stretch;
			width: 100%;
			flex: 0 0 auto;
			}

			h1, p {
				margin: 0;
			}
			h1 {
			position: relative;
			align-self: stretch;
			margin-top: -1.00px;
			font-family: "Inter-Bold", Helvetica;
			font-weight: 700;
			color: #4d1799;
			font-size: 36px;
			text-align: center;
			letter-spacing: 0;
			line-height: normal;
			}

			p {
			position: relative;
			align-self: stretch;
			font-family: "Inter-Regular", Helvetica;
			font-weight: 400;
			color: #4d1799;
			font-size: 24px;
			text-align: center;
			letter-spacing: 0;
			line-height: normal;
			}

			.input-field-group {
			display: flex;
			flex-direction: column;
			align-items: flex-start;
			justify-content: center;
			gap: 16px;
			position: relative;
			align-self: stretch;
			width: 100%;
			flex: 0 0 auto;
			}

			.input-field {
			display: flex;
			height: 54px;
			align-items: center;
			padding: 4px 16px;
			position: relative;
			align-self: stretch;
			border-radius: 12px;
			border: 1px solid;
			border-color: #aeaeae;
			}

			.input-text-wrapper {
			border: none;
			width: 100%;
			background: transparent;
			position: relative;
			color: #5f48f9;
			text-align: left;
			font-family: "Inter-Regular", Helvetica;
			font-weight: 100;
			font-size: 18px;
			letter-spacing: 0;
			line-height: normal;
			}

			select.input-text-wrapper:invalid,
			.input-text-wrapper::placeholder {
			color: #c2b3ce;
			}

			.input-text-wrapper:focus {
			outline: none;
			}

			.input-field:focus-within {
			border-color: #717bff;
			box-shadow: 0 0 0 2px rgba(113, 123, 255, 0.2);
			}

			.navigation {
			display: flex;
			flex-wrap: wrap;
			align-items: flex-end;
			justify-content: center;
			gap: 8px 8px;
			position: relative;
			align-self: stretch;
			width: 100%;
			flex: 0 0 auto;
			}

			.button-text {
			position: relative;
			width: fit-content;
			font-family: "Inter-Bold", Helvetica;
			font-weight: 700;
			color: #ffffff;
			font-size: 18px;
			text-align: center;
			letter-spacing: 0;
			line-height: normal;
			}

			.btn {
			all: unset;
			/* box-sizing: border-box; */
			display: inline-flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			padding: 14px 16px;
			position: relative;
			flex: 0 0 auto;
			border-radius: 8px;
			cursor: pointer;
			transition: background-color 0.2s ease;
			}

			.btn-primary {
				background-color: #717bff;
			}

			.btn-secondary {
				background-color: #86c7da;
			}

			.btn-primary:hover {
			background-color: #5a66e6;
			}

			.btn-primary:active {
			background-color: #a05aeb;
			}

			.btn-primary:focus-visible {
			outline: 2px solid #4a90e2;
			outline-offset: 2px;
			}

			.btn-secondary:hover {
			background-color: #6fb3c9;
			}

			.btn-secondary:active {
			background-color: #5a9fb8;
			}

			.btn-secondary:focus-visible {
			outline: 2px solid #4a90e2;
			outline-offset: 2px;
			}

			.visually-hidden {
			position: absolute;
			width: 1px;
			height: 1px;
			padding: 0;
			margin: -1px;
			overflow: hidden;
			clip: rect(0, 0, 0, 0);
			white-space: nowrap;
			border-width: 0;
			}

			.error {
			color: #f38265;
			text-align: left;
			font-family: "Inter-Regular", Helvetica;
			font-size: 14px;
			display: none;
			}

			.error.active {
			display: inline;
			}
		</style>

	</head>
	<body>
		<section class="card">
			<header class="desc">
				<h1>Filter Task</h1>
				<p>PHP</p>
			</header>

			<form class="input-field-group" action="/cgi-bin/filterTask.php" method="get" onsubmit="return validateForm()">
				<div class="input-field">
					<label for="id" class="visually-hidden">ID</label>
					<input
						class="input-text-wrapper"
						type="number"
						id="id"
						name="id"
						placeholder="Enter Task ID..."
					/>
				</div>
				<div class="input-field">
					<label for="description" class="visually-hidden">Description</label>
					<select
						class="input-text-wrapper"
						id="description"
						name="description"
						>
						<option value="" disabled selected>--- Select Description ---</option>
						<option value="Finish Express.js tutorial">Finish Express.js tutorial</option>
						<option value="Go grocery shopping">Go grocery shopping</option>
						<option value="Prepare for exams">Prepare for exams</option>
						<option value="Book dentist appointment">Book dentist appointment</option>
						<option value="Water the plants">Water the plants</option>
						<option value="Call the bank">Call the bank</option>
					</select>
				</div>
				<div class="input-field">
					<label for="done" class="visually-hidden">Status</label>
					<select
						class="input-text-wrapper"
						id="done"
						name="done"
						>
						<option value="" disabled selected>--- Select Status ---</option>
						<option value="true">Done</option>
						<option value="false">Not Done</option>
					</select>
				</div>
				<div class="input-field">
					<label for="priority" class="visually-hidden">Priority</label>
					<select
						id="priority"
						class="input-text-wrapper"
						name="priority"
						>
						<option value="" disabled selected>--- Select Priority ---</option>
						<option value="high">High</option>
						<option value="medium">Medium</option>
						<option value="low">Low</option>
					</select>
				</div>

				<div class="navigation">
					<button type="submit" class="btn btn-primary">
						<span class="button-text">Apply Filter</span>
					</button>
					<button type="button" class="btn btn-secondary" onclick="location.href='/'">
						<span class="button-text">Back to Home</span>
					</button>
				</div>
			</form>
		</section>
		<script>
			// JavaScript function to validate form
			function validateForm() {
			// Get the values of the input fields
			const idField = document.getElementById("id").value;
			const descriptionField = document.getElementById("description").value;
			const doneField = document.getElementById("done").value;
			const priorityField = document.getElementById("priority").value;

			// Check if at least one of the fields has a value
			if (idField.trim() === "" && descriptionField.trim() === "" && doneField.trim() === "" && priorityField.trim() === "") {
				alert("Please fill up at least one field.");
				return false;  // Prevent form submission
			}
			return true;
			}
		</script>
	</body>
</html>
